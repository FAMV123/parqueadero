<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parqueadero - Ingreso</title>
  <style>
    :root {
      --asfalto: #12151c;
      --asfalto2: #1b2029;
      --amarillo: #facc15;
      --amarillo2: #eab308;
      --texto: #f8fafc;
      --suave: #94a3b8;
      --rojo: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--texto);
      background-color: var(--asfalto);
      /* Asfalto con líneas de parqueo */
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(250, 204, 21, .10), transparent 55%),
        radial-gradient(ellipse at 85% 90%, rgba(59, 130, 246, .10), transparent 50%),
        repeating-linear-gradient(90deg, transparent 0 118px, rgba(255, 255, 255, .06) 118px 122px),
        linear-gradient(180deg, var(--asfalto2), var(--asfalto));
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .contenedor {
      width: 100%;
      max-width: 940px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
      border: 1px solid rgba(255, 255, 255, .08);
      animation: entrar .6s ease-out both;
    }
    @keyframes entrar { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    /* ----- Lado izquierdo: marca ----- */
    .marca {
      position: relative;
      padding: 44px 40px;
      background:
        repeating-linear-gradient(-45deg, rgba(0, 0, 0, .9) 0 18px, var(--amarillo) 18px 36px) top / 100% 12px no-repeat,
        linear-gradient(160deg, #222833, #161a22);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
    }
    .letrero {
      width: 92px; height: 92px;
      border-radius: 20px;
      background: linear-gradient(145deg, #2563eb, #1d4ed8);
      border: 4px solid #fff;
      display: grid; place-items: center;
      font-size: 58px; font-weight: 900; color: #fff;
      box-shadow: 0 10px 30px rgba(37, 99, 235, .45);
      margin-top: 10px;
    }
    .marca h1 { margin: 18px 0 6px; font-size: 32px; line-height: 1.1; letter-spacing: -.5px; }
    .marca p { margin: 0; color: var(--suave); font-size: 15px; line-height: 1.5; }
    .reloj {
      background: rgba(0, 0, 0, .35);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 16px;
      padding: 16px 18px;
    }
    .reloj .h { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; color: var(--amarillo); }
    .reloj .f { color: var(--suave); font-size: 14px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chips span {
      font-size: 13px; padding: 6px 10px; border-radius: 999px;
      background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08); color: #cbd5e1;
    }

    /* ----- Lado derecho: formulario ----- */
    .form {
      background: rgba(10, 12, 17, .85);
      backdrop-filter: blur(8px);
      padding: 44px 40px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .form h2 { margin: 0 0 6px; font-size: 24px; }
    .form .sub { margin: 0 0 26px; color: var(--suave); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--suave); margin: 14px 0 6px; }
    .campo { position: relative; }
    .campo svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: #64748b; pointer-events: none; }
    input {
      width: 100%;
      padding: 14px 14px 14px 46px;
      font-size: 16px;
      color: var(--texto);
      background: #0b0e14;
      border: 1.5px solid #2a3140;
      border-radius: 12px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--amarillo); box-shadow: 0 0 0 4px rgba(250, 204, 21, .15); }
    .ver {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: transparent; border: 0; color: var(--suave); cursor: pointer;
      font-size: 13px; padding: 8px 10px; border-radius: 8px;
    }
    .ver:hover { color: var(--texto); background: rgba(255, 255, 255, .06); }
    .entrar {
      margin-top: 26px; width: 100%;
      padding: 15px; border: 0; border-radius: 12px;
      background: linear-gradient(180deg, var(--amarillo), var(--amarillo2));
      color: #111; font-size: 17px; font-weight: 800; cursor: pointer;
      box-shadow: 0 10px 24px rgba(250, 204, 21, .25);
      transition: transform .08s, filter .15s;
    }
    .entrar:hover { filter: brightness(1.05); }
    .entrar:active { transform: translateY(1px); }
    .entrar:disabled { opacity: .6; cursor: wait; }
    .error {
      margin-top: 14px; padding: 10px 12px; border-radius: 10px;
      background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .35); color: #fecaca; font-size: 14px;
    }
    .error:empty { display: none; }
    .pie { margin-top: 26px; color: #64748b; font-size: 12px; text-align: center; }

    @media (max-width: 760px) {
      .contenedor { grid-template-columns: 1fr; }
      .marca { padding: 32px 24px 24px; gap: 18px; }
      .marca h1 { font-size: 26px; }
      .reloj .h { font-size: 32px; }
      .letrero { width: 72px; height: 72px; font-size: 44px; }
      .form { padding: 28px 24px 32px; }
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <section class="marca">
      <div>
        <div class="letrero">P</div>
        <h1 id="nombre">Parqueadero</h1>
        <p>Control de entradas, salidas, mensualidades y caja.</p>
      </div>
      <div class="reloj">
        <div class="h" id="hora">--:--</div>
        <div class="f" id="fecha"></div>
      </div>
      <div class="chips">
        <span>🏍️ Motos</span><span>🚗 Carros</span><span>🧾 Recibos</span><span>💵 Cierre de caja</span>
      </div>
    </section>

    <section class="form">
      <h2>Iniciar sesión</h2>
      <p class="sub">Ingrese con su usuario de caja o de administrador.</p>
      <form id="form" autocomplete="on">
        <label for="usuario">Usuario</label>
        <div class="campo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input id="usuario" autocomplete="username" required autofocus>
        </div>
        <label for="clave">Clave</label>
        <div class="campo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="clave" type="password" autocomplete="current-password" required style="padding-right:74px">
          <button type="button" class="ver" id="ver">Ver</button>
        </div>
        <button class="entrar" type="submit" id="btnEntrar">Ingresar</button>
        <div id="msg" class="error"></div>
      </form>
      <div class="pie">© <span id="anio"></span> · Sistema de parqueadero</div>
    </section>
  </div>

  <script>
    const destino = (rol) => (rol === 'admin' ? '/admin.html' : '/caja.html');
    if (localStorage.getItem('token')) location.href = destino(localStorage.getItem('rol'));

    const $ = (id) => document.getElementById(id);
    $('anio').textContent = new Date().getFullYear();

    // Reloj en hora de Colombia
    function tic() {
      const ahora = new Date();
      $('hora').textContent = ahora.toLocaleTimeString('es-CO', { timeZone: 'America/Bogota', hour: '2-digit', minute: '2-digit', hour12: true });
      const f = ahora.toLocaleDateString('es-CO', { timeZone: 'America/Bogota', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      $('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
    }
    tic(); setInterval(tic, 1000);

    // Nombre del parqueadero (el que se configura en "Datos del recibo")
    fetch('/api/marca').then((r) => r.json()).then((d) => {
      if (d.nombre) { $('nombre').textContent = d.nombre; document.title = d.nombre + ' - Ingreso'; }
    }).catch(() => {});

    $('ver').addEventListener('click', () => {
      const oculto = $('clave').type === 'password';
      $('clave').type = oculto ? 'text' : 'password';
      $('ver').textContent = oculto ? 'Ocultar' : 'Ver';
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('msg').textContent = '';
      $('btnEntrar').disabled = true; $('btnEntrar').textContent = 'Ingresando...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: $('usuario').value.trim(), clave: $('clave').value }),
        });
        const r = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(r.error || 'No se pudo ingresar');
        localStorage.setItem('token', r.token);
        localStorage.setItem('rol', r.rol);
        location.href = destino(r.rol);
      } catch (err) {
        $('msg').textContent = err.message === 'Failed to fetch' ? 'Sin conexión. Revise el internet e intente de nuevo.' : err.message;
        $('btnEntrar').disabled = false; $('btnEntrar').textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
